<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FLIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --iv:#F5F0E8;--iv2:#EDE8DF;--iv3:#E5DFD4;
  --enc:#1A1714;--vb:#2C4A3E;--vp:#20372D;
  --do:#C4A882;--gr:#8A8480;--gr2:#B8B4B0;
  --nu:#2A3548;--tb:#4A3728;
  --d:'Cormorant Garamond',Georgia,serif;
  --s:-apple-system,'Helvetica Neue',sans-serif;
  --r:18px;--nav:76px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--s);background:#111;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:430px;height:100dvh;height:100vh;background:var(--iv);position:relative;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,0.5)}

/* VIEWS */
.view{position:absolute;inset:0;opacity:0;transform:translateY(14px);transition:opacity .26s ease,transform .26s ease;will-change:opacity,transform}
.view.vis{opacity:1;transform:none}
.view.out{opacity:0;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease}
.sa{position:absolute;inset:0;bottom:var(--nav);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sa::-webkit-scrollbar{display:none}
.sa.full{bottom:0}

/* NAV */
.nav{position:absolute;bottom:0;left:0;right:0;height:var(--nav);background:rgba(245,240,232,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(26,23,20,.08);display:flex;align-items:center;justify-content:space-around;padding:0 4px 14px;z-index:100}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 10px;border-radius:12px;border:none;background:none;-webkit-appearance:none;transition:background .15s}
.ni:active{background:rgba(26,23,20,.06)}
.ni .ico{font-size:20px;line-height:1;color:var(--gr)}
.ni .lbl{font-size:9px;color:var(--gr);font-weight:500;letter-spacing:.04em}
.ni.act .ico,.ni.act .lbl{color:var(--vb)}
.ni.act .lbl{font-weight:700}
.ni-plus{width:46px;height:46px;border-radius:50%;background:var(--enc);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(26,23,20,.25);transition:transform .15s;-webkit-appearance:none;margin-bottom:6px}
.ni-plus:active{transform:scale(.93)}
.ni-plus svg{width:22px;height:22px;stroke:var(--iv);stroke-width:1.5;fill:none}

/* COMPONENTS */
.btn{display:block;width:100%;padding:15px;border-radius:50px;border:none;cursor:pointer;font-family:var(--s);font-size:15px;font-weight:500;letter-spacing:.03em;text-align:center;transition:transform .12s,opacity .12s;-webkit-appearance:none}
.btn:active{transform:scale(.97);opacity:.9}
.btn-p{background:var(--enc);color:var(--iv)}
.btn-s{background:rgba(26,23,20,.07);color:var(--enc)}
.btn-g{background:var(--vb);color:var(--iv)}
.btn-ghost{background:transparent;border:1px solid rgba(26,23,20,.15);color:var(--enc)}

.sup{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--do);display:block;margin-bottom:8px}
.back-btn{font-size:22px;color:var(--gr);cursor:pointer;display:inline-block;margin-bottom:16px;padding:4px 0;background:none;border:none;-webkit-appearance:none}

/* CARDS */
.card{background:#fff;border:1px solid rgba(26,23,20,.07);border-radius:var(--r)}
.card-d{background:var(--enc);border-radius:var(--r)}
.card-g{background:var(--vb);border-radius:var(--r)}

/* THOUGHT CARD */
.tc{background:#fff;border:1px solid rgba(26,23,20,.07);border-radius:14px;padding:14px;cursor:pointer;transition:transform .12s;display:flex;align-items:flex-start;gap:12px}
.tc:active{transform:scale(.98)}
.tc-badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.ba{background:rgba(44,74,62,.1)}.bk{background:rgba(42,53,72,.1)}.bi{background:rgba(196,168,130,.15)}.br{background:rgba(26,23,20,.07)}.bn{background:var(--iv2)}
.tc-body{flex:1;min-width:0}
.tc-txt{font-size:14px;color:var(--enc);line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-meta{display:flex;gap:6px;flex-wrap:wrap}
.tc-tag{font-size:10px;color:var(--gr);background:var(--iv2);padding:3px 9px;border-radius:50px;font-weight:500}
.tc-arr{color:var(--gr2);font-size:16px;flex-shrink:0;margin-top:4px}

/* PILL */
.pill{display:inline-flex;align-items:center;padding:8px 16px;border-radius:50px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid transparent;transition:all .15s;-webkit-appearance:none}
.pill-l{background:rgba(26,23,20,.07);color:var(--enc)}
.pill-a{background:var(--enc);color:var(--iv)}
.pill-g{background:var(--vb);color:var(--iv)}

/* INPUT */
.inp{width:100%;background:#fff;border:1.5px solid rgba(26,23,20,.1);border-radius:14px;padding:16px;font-family:var(--s);font-size:16px;color:var(--enc);outline:none;-webkit-appearance:none;transition:border-color .15s}
.inp:focus{border-color:var(--vb)}
.inp::placeholder{color:var(--gr2)}

/* ── SPLASH ── */
.splash{background:var(--iv);display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.sp-word{font-family:var(--s);font-size:44px;font-weight:200;letter-spacing:.5em;text-indent:.5em;color:var(--enc);margin:28px 0 16px}
.sp-meth{font-size:11px;letter-spacing:.2em;color:var(--gr);text-transform:uppercase}

/* ── HOME ── */
.hw{padding:52px 20px 24px}
.h-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.h-logo-txt{font-family:var(--s);font-size:18px;font-weight:200;letter-spacing:.4em;color:var(--enc)}
.h-q{font-family:var(--d);font-size:30px;font-weight:300;color:var(--enc);line-height:1.2;margin-bottom:16px;letter-spacing:-.01em}
.h-bar{background:#fff;border:1px solid rgba(26,23,20,.09);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:10px;margin-bottom:24px;cursor:pointer;transition:box-shadow .15s}
.h-bar:active{box-shadow:0 4px 20px rgba(26,23,20,.1)}
.h-bar-ph{flex:1;font-size:15px;color:var(--gr2)}
.h-bar-btn{background:var(--enc);color:var(--iv);border-radius:50px;padding:7px 16px;font-size:12px;font-weight:500}
.h-sec{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gr);margin-bottom:10px}
.h-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.h-act{background:#fff;border:1px solid rgba(26,23,20,.07);border-radius:16px;padding:18px 16px;cursor:pointer;transition:transform .12s;border:none;text-align:left;-webkit-appearance:none;display:block;width:100%}
.h-act:active{transform:scale(.97)}
.ha-ico{font-size:20px;display:block;margin-bottom:8px}
.ha-name{font-size:13px;font-weight:600;color:var(--enc);margin-bottom:2px}
.ha-sub{font-size:11px;color:var(--gr)}
.h-act.hap{background:var(--enc);border:none;grid-column:span 2;display:flex;align-items:center;gap:14px;padding:16px 20px}
.hap .ha-ico{margin-bottom:0;font-size:22px}
.hap .ha-name{color:var(--iv);font-size:14px}
.hap .ha-sub{color:rgba(245,240,232,.5)}
.hap-body{flex:1}
.hap-arr{color:var(--do);font-size:16px}
.h-notice{background:rgba(196,168,130,.12);border:1px solid rgba(196,168,130,.25);border-radius:14px;padding:14px 16px;margin-bottom:14px;cursor:pointer}
.hn-sup{font-size:10px;color:var(--do);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.hn-txt{font-size:13px;color:var(--enc)}
.h-thoughts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}

/* ── DEPOSIT ── */
.dw{padding:60px 24px 24px;height:100%;display:flex;flex-direction:column}
.d-q{font-family:var(--d);font-size:34px;font-weight:300;color:var(--enc);line-height:1.2;margin-bottom:8px;letter-spacing:-.01em}
.d-hint{font-size:13px;color:var(--gr);margin-bottom:24px;line-height:1.5}
.d-ta{width:100%;flex:1;min-height:150px;max-height:240px;background:#fff;border:1.5px solid rgba(26,23,20,.1);border-radius:20px;padding:20px;font-family:var(--s);font-size:17px;color:var(--enc);resize:none;outline:none;line-height:1.5;transition:border-color .15s;-webkit-appearance:none}
.d-ta:focus{border-color:var(--vb)}
.d-ta::placeholder{color:var(--gr2)}
.d-bot{padding-top:16px}
.d-cnt{text-align:right;font-size:11px;color:var(--gr2);margin-bottom:10px}
.d-succ{position:absolute;inset:0;background:var(--iv);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;transition:opacity .4s ease;pointer-events:none}
.d-succ.show{opacity:1;pointer-events:all}
.ds-check{width:60px;height:60px;background:var(--vb);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--iv)}
.ds-word{font-family:var(--d);font-size:42px;font-weight:300;color:var(--enc)}
.ds-ph{font-size:14px;color:var(--gr);text-align:center;max-width:220px;line-height:1.5}

/* ── CLARIFY LIST ── */
.cl-list{padding:0 20px;display:flex;flex-direction:column;gap:8px}
.cl-empty{text-align:center;padding:60px 24px}
.cl-e-ico{font-size:36px;margin-bottom:14px}
.cl-e-title{font-family:var(--d);font-size:28px;font-weight:300;color:var(--enc);margin-bottom:8px}
.cl-e-sub{font-size:14px;color:var(--gr);line-height:1.6}

/* ── CLARIFY FLOW ── */
.cf{padding:20px 24px}
.cf-tc{background:#fff;border:1px solid rgba(26,23,20,.08);border-radius:18px;padding:20px;margin-bottom:24px}
.cft-sup{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--do);margin-bottom:8px}
.cft-txt{font-size:17px;color:var(--enc);line-height:1.4}
.cf-prog{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:22px}
.cf-dot{width:6px;height:6px;border-radius:50%;background:rgba(26,23,20,.15);transition:all .2s}
.cf-dot.act{background:var(--vb);width:20px;border-radius:3px}
.cf-dot.done{background:var(--vb)}
.cf-sl{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gr);margin-bottom:14px}
.cf-nat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.cf-ni{background:#fff;border:1.5px solid rgba(26,23,20,.08);border-radius:14px;padding:16px 12px;cursor:pointer;transition:all .15s;text-align:center;border:none;-webkit-appearance:none;display:block;width:100%}
.cf-ni:active{transform:scale(.96)}
.cf-ni.sel{background:var(--enc)}
.cni-sym{font-size:22px;display:block;margin-bottom:8px}
.cni-lbl{font-size:13px;font-weight:600;color:var(--enc);margin-bottom:3px}
.cni-desc{font-size:11px;color:var(--gr)}
.cf-ni.sel .cni-lbl{color:var(--iv)}
.cf-ni.sel .cni-desc{color:rgba(245,240,232,.5)}
.cf-bubbles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.cf-ens{display:flex;gap:8px;margin-bottom:20px}
.cf-en{flex:1;background:#fff;border:1.5px solid rgba(26,23,20,.08);border-radius:50px;padding:12px 8px;cursor:pointer;text-align:center;font-size:13px;font-weight:500;color:var(--enc);transition:all .15s;border:none;-webkit-appearance:none}
.cf-en.sel{background:var(--enc);color:var(--iv)}

/* ── MOMENT ── */
.mw{padding:60px 24px 24px}
.m-q{font-family:var(--d);font-size:36px;font-weight:300;color:var(--enc);line-height:1.2;letter-spacing:-.01em;margin-bottom:28px}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{background:#fff;border:1.5px solid rgba(26,23,20,.08);border-radius:20px;padding:22px 16px;cursor:pointer;transition:all .18s;text-align:center;border:none;-webkit-appearance:none;display:block;width:100%}
.mc:active{transform:scale(.95)}
.mc.sel{box-shadow:0 0 0 2px var(--enc)}
.mc-ico{font-size:30px;display:block;margin-bottom:10px}
.mc-name{font-size:14px;font-weight:600;color:var(--enc);margin-bottom:4px}
.mc-sub{font-size:11px;color:var(--gr);line-height:1.4}
.mc-fire{background:rgba(44,74,62,.06)}
.mc-pres{background:rgba(74,55,40,.06)}
.mc-slow{background:rgba(42,53,72,.06)}
.mc-float{background:rgba(26,23,20,.04)}

/* ── CAROUSEL ── */
.cw{height:100%;display:flex;flex-direction:column;background:var(--iv)}
.cw-hd{padding:52px 24px 12px;display:flex;align-items:center;justify-content:space-between}
.cw-mood{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gr)}
.cw-cnt{font-size:12px;color:var(--gr2)}
.cw-msg{padding:0 24px 16px;font-family:var(--d);font-size:19px;font-weight:300;font-style:italic;color:var(--gr);line-height:1.4}
.cw-track{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cc{position:absolute;width:calc(100% - 56px);max-width:330px;background:#fff;border-radius:24px;padding:26px 22px;box-shadow:0 8px 40px rgba(26,23,20,.1);border:1px solid rgba(26,23,20,.06);cursor:grab;user-select:none;will-change:transform,opacity;transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .32s cubic-bezier(.4,0,.2,1)}
.cc.drag{cursor:grabbing;transition:none}
.cc.prev{transform:translateX(-115%) scale(.88);opacity:.35}
.cc.next{transform:translateX(115%) scale(.88);opacity:.35}
.cc.main{transform:none;opacity:1;z-index:5}
.cc.out-l{transform:translateX(-160%) scale(.82) rotate(-8deg);opacity:0}
.cc.out-r{transform:translateX(160%) scale(.82) rotate(8deg);opacity:0}
.cc-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cc-sym{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px}
.cc-nat{font-size:11px;font-weight:600;color:var(--gr);text-transform:uppercase;letter-spacing:.08em}
.cc-txt{font-family:var(--d);font-size:21px;font-weight:400;color:var(--enc);line-height:1.35;margin-bottom:18px}
.cc-meta{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.cc-tag{font-size:11px;padding:5px 12px;border-radius:50px}
.cc-e{background:var(--iv2);color:var(--gr)}
.cc-b{background:var(--vb);color:var(--iv)}
.cc-mv{background:var(--iv2);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.ccm-lbl{font-size:10px;color:var(--gr);margin-bottom:3px}
.ccm-act{font-size:15px;font-weight:600;color:var(--enc)}
.ccm-arr{color:var(--do);font-size:18px}
.sw-rest{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:rgba(42,53,72,.92);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;opacity:0;transition:opacity .15s;pointer-events:none;z-index:10}
.sw-do{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(44,74,62,.92);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;opacity:0;transition:opacity .15s;pointer-events:none;z-index:10}
.cw-btns{display:flex;align-items:center;justify-content:space-between;padding:12px 28px 4px}
.cw-btn{width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(26,23,20,.12);background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .15s;-webkit-appearance:none}
.cw-btn:active{background:var(--iv2)}
.cw-btn-rest{border-color:rgba(42,53,72,.25);background:rgba(42,53,72,.06)}
.cw-btn-do{border-color:rgba(44,74,62,.3);background:rgba(44,74,62,.08)}
.cw-dots{display:flex;justify-content:center;gap:6px;padding:12px 0 16px}
.cw-dot{width:6px;height:6px;border-radius:50%;background:rgba(26,23,20,.15);transition:all .2s}
.cw-dot.act{background:var(--vb);width:16px;border-radius:3px}

/* Movement applied */
.ma{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center;background:var(--iv)}
.ma-ico{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:20px}
.ma-mv{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--do);margin-bottom:10px}
.ma-th{font-family:var(--d);font-size:26px;font-weight:300;color:var(--enc);line-height:1.3;margin-bottom:14px;max-width:280px}
.ma-ph{font-size:14px;color:var(--gr);line-height:1.6;margin-bottom:32px;max-width:240px}

/* Carousel empty / done */
.cw-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.cwd-ico{font-size:40px;margin-bottom:16px}
.cwd-title{font-family:var(--d);font-size:30px;font-weight:300;color:var(--enc);margin-bottom:10px}
.cwd-sub{font-size:14px;color:var(--gr);line-height:1.6;margin-bottom:28px}

/* ── BUBBLES ── */
.bub-grid{padding:0 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bub-card{border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .15s;border:none;-webkit-appearance:none;display:block;width:100%;text-align:left}
.bub-card:active{transform:scale(.96)}
.bc-top{padding:22px 18px 14px;display:flex;flex-direction:column;gap:8px;min-height:130px}
.bc-ico{font-size:26px}
.bc-name{font-size:15px;font-weight:600;color:var(--iv)}
.bc-cnt{font-size:11px;color:rgba(245,240,232,.55)}
.bc-bot{background:rgba(0,0,0,.15);padding:9px 18px;display:flex;justify-content:flex-end}
.bc-arr{color:rgba(245,240,232,.5);font-size:13px}
.bub-add{background:#fff;border:1.5px dashed rgba(26,23,20,.15);border-radius:20px;padding:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;gap:8px;-webkit-appearance:none;transition:border-color .15s}
.bub-add:active{border-color:var(--vb)}
.ba-ico{font-size:22px;color:var(--gr2)}
.ba-lbl{font-size:12px;color:var(--gr)}

/* Bubble Detail */
.bd{height:100%;display:flex;flex-direction:column}
.bd-hd{padding:50px 24px 20px}
.bd-back{font-size:22px;cursor:pointer;margin-bottom:14px;display:inline-block;-webkit-appearance:none;background:none;border:none}
.bd-ico{font-size:34px;display:block;margin-bottom:10px}
.bd-name{font-family:var(--d);font-size:40px;font-weight:300;margin-bottom:4px}
.bd-int{font-size:14px;font-style:italic;opacity:.6}
.bd-tabs{display:flex;padding:0 24px}
.bd-tab{padding:10px 14px;font-size:13px;font-weight:500;opacity:.5;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;background:none;border:none;border-bottom:2px solid transparent;-webkit-appearance:none}
.bd-tab.act{opacity:1;border-bottom-color:var(--do)}
.bd-body{flex:1;overflow-y:auto;background:var(--iv);padding:16px 20px}
.bd-empty{text-align:center;padding:36px 20px;color:var(--gr);font-size:14px;line-height:1.6}

/* ── TRACES ── */
.tw{padding:0 20px 24px}
.t-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.t-stat{background:#fff;border:1px solid rgba(26,23,20,.07);border-radius:16px;padding:18px 16px}
.t-stat.big{grid-column:span 2;background:var(--vb);border-color:transparent}
.ts-num{font-family:var(--d);font-size:42px;font-weight:300;color:var(--enc);line-height:1;margin-bottom:6px}
.big .ts-num{color:var(--iv)}
.ts-lbl{font-size:12px;color:var(--gr)}
.big .ts-lbl{color:rgba(245,240,232,.55)}
.t-phrase{font-family:var(--d);font-size:22px;font-weight:300;font-style:italic;color:var(--gr);text-align:center;padding:16px 24px;margin-bottom:20px;line-height:1.4}

/* ── JOURNAL ── */
.jw{padding:16px 24px 24px;height:100%;display:flex;flex-direction:column}
.j-ref{background:rgba(26,23,20,.04);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.jr-sym{font-size:17px}
.jr-txt{font-size:13px;color:var(--enc);line-height:1.4}
.j-prompts{margin-bottom:14px}
.jp-lbl{font-size:10px;color:var(--gr);margin-bottom:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.jp-item{font-size:13px;color:var(--gr);font-style:italic;padding:6px 0;border-bottom:1px solid rgba(26,23,20,.06);line-height:1.5}
.jp-item:last-child{border-bottom:none}
.j-ta{flex:1;min-height:150px;background:#fff;border:1.5px solid rgba(26,23,20,.1);border-radius:16px;padding:16px;font-family:var(--s);font-size:16px;color:var(--enc);resize:none;outline:none;line-height:1.6;transition:border-color .15s;-webkit-appearance:none;margin-bottom:14px}

/* ── RETURN SCREEN ── */
.rw{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.rw-word{font-family:var(--s);font-size:20px;font-weight:200;letter-spacing:.45em;color:var(--enc);margin-bottom:28px}
.rw-title{font-family:var(--d);font-size:34px;font-weight:300;color:var(--enc);line-height:1.3;margin-bottom:10px}
.rw-ph{font-size:14px;color:var(--gr);margin-bottom:36px;line-height:1.6}
.rw-opts{display:flex;flex-direction:column;gap:10px;width:100%}
.rw-opt{background:#fff;border:1px solid rgba(26,23,20,.08);border-radius:14px;padding:16px 20px;cursor:pointer;text-align:left;font-size:14px;font-weight:500;color:var(--enc);display:flex;align-items:center;justify-content:space-between;border:none;transition:background .15s;-webkit-appearance:none}
.rw-opt:active{background:var(--iv2)}
.rw-opt-arr{color:var(--gr2);font-size:16px}

/* ADD BUBBLE */

.ab-inp:focus{border-color:var(--vb)}

<div id="app"></div>
<script>
// ── CONSTANTS ─────────────────────────────────
const MOODS = {

const NATURES = {

const BUBBLE_EMOJIS = ['🏠','💼','🌿','🎨','💰','✈️','🏡','💞','🏃','📁','🌙','🎯','📚','🌊','🎵'];
const BUBBLE_COLORS = ['#2C4A3E','#2A3548','#4A3728','#20372D','#3A2A48','#1A2838','#3A2820'];

const DEFAULT_BUBBLES = [
  {id:'quotidien', name:'Quotidien', emoji:'🏠', color:'#2C4A3E'},
  {id:'travail',   name:'Travail',   emoji:'💼', color:'#2A3548'},
  {id:'bien-etre', name:'Bien-être', emoji:'🌿', color:'#20372D'},
  {id:'creation',  name:'Création',  emoji:'🎨', color:'#4A3728'},
];

const JOURNAL_PROMPTS = {
  knot:    ["Qu'est-ce qui prend vraiment de la place ici ?","Qu'est-ce que je porte seule ?","Est-ce que ça demande une action, une décision ou simplement de l'espace ?"],
  idea:    ["Qu'est-ce qui rend cette idée excitante ?","Quel serait le premier tout petit pas ?","Avec qui ou quoi ça pourrait se relier ?"],
  action:  ["Quel serait le plus petit mouvement possible ?","Qu'est-ce qui rend cette tâche lourde ?","Qu'est-ce qui peut être fait en moins de 5 minutes ?"],
  reminder:["Pourquoi je procrastine là-dessus ?","Quelle serait la conséquence de continuer à attendre ?","Qu'est-ce qui m'en empêche réellement ?"],
  free:    ["Qu'est-ce qui tourne en fond ?","Qu'est-ce que je n'ai plus besoin de porter ce soir ?","Qu'est-ce qui peut attendre demain ?"],
};

// ── STATE ─────────────────────────────────────
let S = {
  thoughts: [],
  bubbles: JSON.parse(JSON.stringify(DEFAULT_BUBBLES)),
  journalEntries: [],
  mood: null,
  carouselQ: [],
  carouselIdx: 0,
  clarifyT: null,
  clarifyStep: 1,
  clarifyNature: null,
  clarifyBubble: null,
  clarifyEnergy: null,
  bubbleTab: 'vivant',
  addBubbleEmoji: '🏡',
  addBubbleColor: '#2A3548',
  view: 'splash',
  prevView: null,
};

// ── STORAGE ───────────────────────────────────
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('flit_data') || '{}');
    if (d.thoughts) S.thoughts = d.thoughts;
    if (d.bubbles) S.bubbles = d.bubbles;
    if (d.journalEntries) S.journalEntries = d.journalEntries;
  } catch(e){}
}
function save() {
  try {
    localStorage.setItem('flit_data', JSON.stringify({
      thoughts: S.thoughts,
      bubbles: S.bubbles,
      journalEntries: S.journalEntries,
    }));
    localStorage.setItem('flit_last', Date.now().toString());
  } catch(e){}
}
function shouldReturn() {
  const last = localStorage.getItem('flit_last');
  if (!last || S.thoughts.length === 0) return false;
  return (Date.now() - parseInt(last)) > 3 * 24 * 60 * 60 * 1000;
}

// ── UTILITIES ─────────────────────────────────
const uid = () => Math.random().toString(36).slice(2);
function getBubble(id) { return S.bubbles.find(b => b.id === id); }
function getN(nature) { return NATURES[nature] || {sym:'·',lbl:'',desc:'',mv:'rest',cls:'bn'}; }
function getBadgeCls(nature) { return getN(nature).cls; }
function getSymHTML(nature) {
  const n = getN(nature);
  return `<div class="tc-badge ${n.cls}">${n.sym}</div>`;
}
function thinkTag(t) {
  const tags = [];
  if (t.energyRequired) {
    const map = {soft:'Douce',normal:'Normale',intense:'Intense'};
    tags.push(map[t.energyRequired] || t.energyRequired);
  }
  if (t.bubbleId) {
    const b = getBubble(t.bubbleId);
    if (b) tags.push(b.emoji + ' ' + b.name);
  }
  return tags;
}

// ── RECOMMENDATION MATRIX ────────────────────
function getRecommendedThoughts(mood) {
  const all = S.thoughts.filter(t => t.status === 'clarified');
  const deposed = S.thoughts.filter(t => t.status === 'deposed');
  if (mood === 'on_fire') {
    return all.filter(t => t.energyRequired === 'normal' || t.energyRequired === 'intense').slice(0,5);
  }
  if (mood === 'under_pressure') {
    return all.filter(t => t.energyRequired === 'soft' || t.nature === 'reminder').slice(0,3);
  }
  if (mood === 'slow') {
    return all.filter(t => t.energyRequired === 'soft').slice(0,4);
  }
  if (mood === 'floating') {
    return [...deposed, ...all.filter(t => t.nature === 'idea')].slice(0,5);
  }
  return all.slice(0,5);
}

function getRecommendedMovement(t) {
  if (!t.nature) return 'do';
  return getN(t.nature).mv;
}

function seedDemo() {
  if (S.thoughts.length > 0) return;
  const demo = [
    {text:"Je me sens bloquée dans ce projet depuis des semaines", nature:'knot',   energyRequired:'intense', bubbleId:'travail',   status:'clarified'},
    {text:"Appeler le médecin — ça traîne depuis trop longtemps",  nature:'reminder',energyRequired:'soft',    bubbleId:null,        status:'clarified'},
    {text:"Idée : réorganiser entièrement l'espace de travail",    nature:'idea',    energyRequired:'soft',    bubbleId:'quotidien', status:'clarified'},
    {text:"Envoyer le bilan à l'équipe avant vendredi",            nature:'action',  energyRequired:'normal',  bubbleId:'travail',   status:'clarified'},
    {text:"Voyage à Lisbonne en septembre, à explorer",            nature:'idea',    energyRequired:'soft',    bubbleId:null,        status:'clarified'},
    {text:"Je ne sais pas pourquoi je procrastine sur cette décision", status:'deposed'},
    {text:"Il faudrait que je parle de ce que je ressens en ce moment", status:'deposed'},
  ];
  S.thoughts = demo.map((d,i) => ({
    id: (i+1).toString(),
    createdAt: new Date(Date.now() - (demo.length-i)*86400000*0.8).toISOString(),
    status:'deposed', nature:null, energyRequired:null, bubbleId:null,
    recommendedMovement:null, journalEntries:[],
    ...d,
    recommendedMovement: d.nature ? getN(d.nature).mv : null,
  }));
  save();
}

// ── NAVIGATION ────────────────────────────────
function go(view, params={}) {
  S.prevView = S.view;
  S.view = view;
  Object.assign(S, params);
  render();
}
function back() { go(S.prevView || 'home'); }

function render() {
  const app = document.getElementById('app');
  const old = app.querySelector('.view');
  const div = document.createElement('div');
  div.className = 'view';

  const views = {
    splash, home, deposit, clarify_list, clarify_flow,
    moment, carousel, move_applied, bubbles, bubble_detail,
    traces, journal, return_screen, add_bubble,
  };

  div.innerHTML = (views[S.view] || home)();
  app.appendChild(div);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      div.classList.add('vis');
      if (old) { old.classList.add('out'); setTimeout(()=>old.remove(), 220); }
    });
  });

  afterRender();
}

function afterRender() {
  if (S.view === 'splash') {
    initSplashAnim();
    setTimeout(()=> go(shouldReturn() ? 'return_screen' : 'home'), 2800);
  }
  if (S.view === 'carousel') {
    initCarousel();
  }
  if (S.view === 'deposit') {
    const ta = document.getElementById('d-ta');
    if (ta) setTimeout(()=>ta.focus(), 350);
  }
}

// ── NAV HTML ─────────────────────────────────
function navHTML(active) {
  const items = [
    {v:'home',     ico:'⌂',  lbl:'Accueil'},
    {v:'plus',     ico:'',   lbl:'Déposer', plus:true},
    {v:'moment',   ico:'◉',  lbl:'Moment'},
    {v:'bubbles',  ico:'◯',  lbl:'Bulles'},
    {v:'traces',   ico:'∿',  lbl:'Traces'},
  ];
  return `<div class="nav">${items.map(i => i.plus ? `
    <button class="ni-plus" onclick="go('deposit')">
      <svg viewBox="0 0 22 22"><line x1="11" y1="3" x2="11" y2="19"/><line x1="3" y1="11" x2="19" y2="11"/></svg>
    </button>` : `
    <button class="ni${active===i.v?' act':''}" onclick="go('${i.v}')">
      <span class="ico">${i.ico}</span>
      <span class="lbl">${i.lbl}</span>
    </button>`
  ).join('')}</div>`;
}

// ── VIEW: SPLASH ──────────────────────────────
function splash() {
  return `<div class="view vis splash">
    <div style="margin-bottom:32px">
      <svg id="sp-svg" width="240" height="110" viewBox="0 0 240 110" fill="none">
        <path id="sp-knot"
          d="M 96 55 C 98 34,118 22,131 40 C 144 58,129 82,108 78 C 87 74,72 54,84 38 C 96 22,122 30,116 52 C 110 74,86 78,75 61 C 64 44,81 27,104 37 C 127 47,124 75,102 80 C 80 85,62 65,72 48 C 82 31,110 36,104 57 L 228 57"
          stroke="#1A1714" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <path id="sp-line"
          d="M 18 57 C 78 47,158 67,228 57"
          stroke="#1A1714" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0"/>
      </svg>
    </div>
    <div class="sp-word">FLIT</div>
    <div class="sp-meth">Déposer · Clarifier · Avancer</div>
  </div>`;
}

function initSplashAnim() {
  const knot = document.getElementById('sp-knot');
  const line = document.getElementById('sp-line');
  if (!knot || !line) return;
  const kl = knot.getTotalLength();
  const ll = line.getTotalLength();
  knot.style.strokeDasharray = kl;
  knot.style.strokeDashoffset = kl;
  line.style.strokeDasharray = ll;
  line.style.strokeDashoffset = ll;
  // Draw knot
  setTimeout(() => {
    knot.style.transition = 'stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)';
    knot.style.strokeDashoffset = 0;
  }, 200);
  // Unravel
  setTimeout(() => {
    knot.style.transition = 'stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1),opacity .4s ease .8s';
    knot.style.strokeDashoffset = -kl;
    knot.style.opacity = 0;
    line.style.opacity = 1;
    line.style.transition = 'stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1),opacity .15s ease';
    line.style.strokeDashoffset = 0;
  }, 1800);
}

// ── VIEW: DEPOSIT ─────────────────────────────
function deposit() {
  return `<div class="sa full">
    <div class="dw">
      <button class="back-btn" onclick="go('home')">←</button>
      <div class="d-q">Qu'est-ce qui prend de la place ?</div>
      <div class="d-hint">Rien n'a besoin d'être clair. Dépose, c'est tout.</div>
      <textarea id="d-ta" class="d-ta" placeholder="Je pense à… Il faudrait que… Je me sens…" maxlength="400" oninput="updateDepositCount()"></textarea>
      <div class="d-bot">
        <div class="d-cnt"><span id="d-cnt">0</span> / 400</div>
        <button class="btn btn-p" onclick="submitDeposit()">Déposer</button>
      </div>
    </div>
    <div class="d-succ" id="d-succ">
      <div class="ds-check">✓</div>
      <div class="ds-word">Déposé.</div>
      <div class="ds-ph">Tu peux le clarifier plus tard.<br>Ou le laisser reposer ici.</div>
    </div>
  </div>`;
}

function updateDepositCount() {
  const ta = document.getElementById('d-ta');
  const cnt = document.getElementById('d-cnt');
  if (ta && cnt) cnt.textContent = ta.value.length;
}

function submitDeposit() {
  const ta = document.getElementById('d-ta');
  if (!ta || !ta.value.trim()) return;
  S.thoughts.unshift({
    id: uid(),
    text: ta.value.trim(),
    createdAt: new Date().toISOString(),
    status: 'deposed',
    nature: null, energyRequired: null, bubbleId: null,
    recommendedMovement: null, journalEntries: [],
  });
  save();
  const succ = document.getElementById('d-succ');
  if (succ) { succ.classList.add('show'); }
  setTimeout(() => go('home'), 2000);
}

function startClarify(id) {
  S.clarifyT = S.thoughts.find(t => t.id === id);
  S.clarifyStep = 1;
  S.clarifyNature = null;
  S.clarifyBubble = null;
  S.clarifyEnergy = null;
  go('clarify_flow');
}

// ── VIEW: CLARIFY FLOW ────────────────────────
function clarify_flow() {
  const t = S.clarifyT;
  if (!t) return clarify_list();

  function dots() {
    return [1,2,3].map(i => `<div class="cf-dot${S.clarifyStep>i?' done':S.clarifyStep===i?' act':''}"></div>`).join('');
  }

  let stepHTML = '';
  if (S.clarifyStep === 1) {
    stepHTML = `
      <div class="cf-sl">Qu'est-ce que c'est ?</div>
      <div class="cf-nat">
        ${Object.entries(NATURES).map(([k,n]) => `
          <button class="cf-ni${S.clarifyNature===k?' sel':''}" onclick="pickNature('${k}')">
            <span class="cni-sym">${n.sym}</span>
            <div class="cni-lbl">${n.lbl}</div>
            <div class="cni-desc">${n.desc}</div>

      <button class="cw-btn cw-btn-rest" onclick="applyMovement('rest')" title="Reposer">💤</button>
      <div style="font-size:11px;color:var(--gr2);text-align:center">← Reposer · ${mv.lbl} →</div>
      <button class="cw-btn cw-btn-do"   onclick="applyMovement('${t.recommendedMovement||n.mv}')" title="${mv.lbl}">${mv.ico}</button>
    </div>
    <div class="cw-dots">${dotsHTML}</div>

function applyMovement(mvKey) {
  const t = S.carouselQ[S.carouselIdx];
  if (!t) return;
  const thought = S.thoughts.find(x => x.id === t.id);
  if (thought) {
    thought.status = mvKey === 'rest' ? 'rested' : 'in_motion';
    thought.recommendedMovement = mvKey;
    save();
  }
  S.appliedMovement = mvKey;
  S.appliedThought = t;
  go('move_applied');
}

function initCarousel() {
  const card = document.getElementById('cc-main');
  if (!card) return;
  let startX = null, offset = 0, dragging = false;

  function onStart(x) { startX = x; dragging = true; card.classList.add('drag'); }
  function onMove(x) {
    if (!dragging) return;
    offset = x - startX;
    card.style.transform = `translateX(${offset}px) rotate(${offset*.025}deg)`;
    const ri = document.getElementById('sw-rest');
    const di = document.getElementById('sw-do');
    if (offset < -40) {
      if(ri) ri.style.opacity = Math.min(1, Math.abs(offset)/80);
      if(di) di.style.opacity = 0;
    } else if (offset > 40) {
      if(di) di.style.opacity = Math.min(1, offset/80);
      if(ri) ri.style.opacity = 0;
    } else {
      if(ri) ri.style.opacity = 0;
      if(di) di.style.opacity = 0;
    }
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('drag');
    const t = S.carouselQ[S.carouselIdx];
    const n = getN(t ? t.nature : null);
    if (offset < -80) {
      card.style.transition = 'all .35s cubic-bezier(.4,0,.2,1)';
      card.style.transform = 'translateX(-160%) rotate(-10deg)';
      card.style.opacity = '0';
      setTimeout(() => applyMovement('rest'), 340);
    } else if (offset > 80) {
      card.style.transition = 'all .35s cubic-bezier(.4,0,.2,1)';
      card.style.transform = 'translateX(160%) rotate(10deg)';
      card.style.opacity = '0';
      setTimeout(() => applyMovement(t ? (t.recommendedMovement||n.mv) : 'do'), 340);
    } else {
      card.style.transition = 'transform .3s cubic-bezier(.4,0,.2,1)';
      card.style.transform = '';
      const ri = document.getElementById('sw-rest');
      const di = document.getElementById('sw-do');
      if(ri) ri.style.opacity = 0;
      if(di) di.style.opacity = 0;
    }
    offset = 0; startX = null;
  }

  card.addEventListener('touchstart', e => onStart(e.touches[0].clientX), {passive:true});
  card.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e.touches[0].clientX); }, {passive:false});
  card.addEventListener('touchend',   onEnd);
  card.addEventListener('mousedown',  e => onStart(e.clientX));
  window.addEventListener('mousemove', e => { if(dragging) onMove(e.clientX); });
  window.addEventListener('mouseup',   onEnd);
}

function createBubble() {
  const inp = document.getElementById('ab-name');
  const name = inp ? inp.value.trim() : '';
  if (!name) { if(inp) inp.focus(); return; }
  S.bubbles.push({
    id: uid(),
    name,
    emoji: S.addBubbleEmoji,
    color: S.addBubbleColor,
  });
  save();
  go('bubbles');
}

// ── SHARED COMPONENTS ─────────────────────────
function thoughtCardHTML(t, onclick) {
  const n = getN(t.nature);
  const tags = thinkTag(t);
  const mv = t.recommendedMovement ? (MOVEMENTS[t.recommendedMovement]||{}).lbl : '';
  return `<div class="tc"${onclick?` onclick="${onclick}"`:''}>
    <div class="tc-badge ${n.cls}">${n.sym||'·'}</div>
    <div class="tc-body">
      <div class="tc-txt">${esc(t.text)}</div>
      <div class="tc-meta">
        ${tags.map(tg=>`<span class="tc-tag">${tg}</span>`).join('')}
        ${mv?`<span class="tc-tag" style="color:var(--vb)">${mv}</span>`:''}
      </div>
    </div>
    ${onclick?`<span class="tc-arr">→</span>`:''}
  </div>`;
}

// ── UTILITIES ─────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeSince(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const h = Math.floor(diff/3600000);
  const d = Math.floor(diff/86400000);
  if (d > 1) return `Il y a ${d} jours`;
  if (d === 1) return 'Hier';
  if (h > 1) return `Il y a ${h}h`;
  return "À l'instant";
}
